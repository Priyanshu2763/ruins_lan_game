name: Android app (debug APK)

# Builds the WebView-container Android app that lives in app/ — see app/README.md. This is a
# pure CI config file, kept in the conventional .github/workflows/ location GitHub requires;
# the actual app source/config is entirely inside app/, nothing outside that folder was touched.
on:
  push:
    branches: [development, master]
    paths:
      - "app/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wreckveil-debug-apk
          path: app/app/build/outputs/apk/debug/app-debug.apk
